name: daily-podcast

on:
  schedule:
    - cron: "0 8 * * *"   # 毎日 17:00（日本時間）。GitHubの混雑で数十分遅れることがあります
  workflow_dispatch:       # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Generate episode
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/podcast.py

      - name: Publish MP3
        if: steps.gen.outputs.has_episode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.gen.outputs.tag }}" "${{ steps.gen.outputs.mp3 }}" \
            --title "${{ steps.gen.outputs.title }}" --notes-file out/release_notes.md
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
          done < out/delete_tags.txt

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "update $(date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
