name: daily-podcast

on:
  schedule:
    - cron: "30 8 * * *"   # 毎日 17:30（日本時間）。無料枠が17時ごろにリセットされた直後
    # 予備。GitHubの混雑で定期実行が半日近く遅れたり飛ばされたりすることがあるため、時刻をずらして何度か起動する。
    # その日のエピソードが作成済みなら、予備の実行はすぐ終わる（1分ほど）
    - cron: "17 10 * * *"  # 19:17（日本時間）
    - cron: "47 12 * * *"  # 21:47（日本時間）
  workflow_dispatch:       # 「Run workflow」ボタンで手動実行もできる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Generate episode
        id: gen
        timeout-minutes: 150
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/podcast.py

      - name: Publish MP3
        id: publish
        if: steps.gen.outputs.has_episode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.gen.outputs.tag }}" "${{ steps.gen.outputs.mp3 }}" \
            --title "${{ steps.gen.outputs.title }}" --notes-file out/release_notes.md
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag || true
          done < out/delete_tags.txt

      - name: Save state   # 途中で止まっても、終わった要約は保存して次回に引き継ぐ
        if: ${{ !cancelled() && steps.publish.outcome != 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "update $(date +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
